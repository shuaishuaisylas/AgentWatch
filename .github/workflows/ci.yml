name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax
        run: node --check web/app.js
      - name: Launcher syntax
        run: |
          zsh -n 启动看板.command
          zsh -n 启动胶囊.command
          for script in desktop/scripts/*.sh; do zsh -n "$script"; done

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift state and transport tests
        run: ./desktop/scripts/test.sh
      - name: Controller integration with artificial responses
        run: ./desktop/scripts/test-controller-read.sh
